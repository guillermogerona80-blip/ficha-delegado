<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f1470"><link rel="apple-touch-icon" href="icon-192.png"><title>Ficha Delegado FBA</title><style>*{box-sizing:border-box}body{margin:0;font:16px Arial,sans-serif;background:#f3f4fb;color:#111;padding-bottom:70px}
header{position:sticky;top:0;background:#0f1470;color:#fff;padding:8px;display:flex;gap:6px;align-items:center;z-index:5}
header b{font-size:14px}header select{flex:1;min-width:0;padding:6px;border-radius:6px}header button{padding:6px 10px}
main{padding:10px}label{display:block;font-size:12px;font-weight:700;color:#555;margin:8px 0}
input,textarea{width:100%;font:16px Arial;padding:10px;border:1px solid #888;border-radius:8px;margin-top:3px;background:#fff}
button{font:700 15px Arial;padding:12px;border:1px solid #0f1470;border-radius:10px;background:#fff;color:#0f1470}
button:disabled{opacity:.35}.go{background:#1a8a3a;color:#fff;border-color:#1a8a3a}.pa{background:#d98200;color:#fff;border-color:#d98200}.del{color:#c00;border-color:#c00;margin-top:14px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #aaa;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none}nav .on{background:#e3e6fa}
.h{font-size:12px;font-weight:700;color:#0f1470;text-transform:uppercase;margin:12px 0 6px}.pl{display:flex;gap:6px}.pl input:first-child{width:70px}
.sc{display:flex;align-items:center;justify-content:space-around;text-align:center;font-weight:700}.sc div{flex:1}.sc b{display:block;font-size:54px}
.qs{display:flex;gap:6px}.qs button{flex:1;padding:6px}.qs .on{background:#0f1470;color:#fff}
.cr{font:700 64px/1.3 monospace;text-align:center}.row{display:flex;gap:8px;margin:8px 0}.row button{flex:1}
.big{padding:22px 6px;font-size:18px;color:#fff}.big.L{background:#1a1fd6}.big.V{background:#e60000}
.gl{display:flex;gap:8px;align-items:center;padding:6px 8px;border-left:6px solid;background:#fff;margin-bottom:4px}.gl span:first-child{flex:1}.gl.L{border-color:#1a1fd6}.gl.V{border-color:#e60000}.gl button{padding:2px 8px}
#sh{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:9}#sh[hidden]{display:none}
.bx{background:#fff;width:100%;padding:14px;border-radius:16px 16px 0 0}.gr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}.gr button{padding:14px 0;font-size:18px}</style></head>

const c=(q,s)=>S.g[q].filter(g=>g.s==s).length,tot=s=>[0,1,2,3].reduce((a,q)=>a+c(q,s),0);
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=b=>{let c=~0;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return ~c>>>0};
const inf=async b=>new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
const xe=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function fillSheet(t){
 const set=(r,v,f)=>{t=t.replace(new RegExp('<c r="'+r+'"([^>]*?)(/>|>[\\s\\S]*?</c>)'),(m,a)=>{const s=(a.match(/ s="(\d+)"/)||[0,0])[1];
  return f?`<c r="${r}" s="${s}"><f>${f}</f><v>${v}</v></c>`:typeof v=='number'?`<c r="${r}" s="${s}"><v>${v}</v></c>`:v===''?`<c r="${r}" s="${s}"/>`:`<c r="${r}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`})};
 set('A4',S.local);set('D4',S.vis);set('N4',S.comp);set('A6',S.lugar);set('N6',S.del);set('A30',S.obs);
 if(S.fecha){const[y,m,d]=S.fecha.split('-');set('D6',(Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5)}
 if(S.hora){const[h,m]=S.hora.split(':');set('I6',(h*60+ +m)/1440)}
 S.p.forEach((p,i)=>{if(p.d!=='')set('A'+(12+i),+p.d);if(p.n)set('B'+(12+i),p.n)});
 const R=[[],[]];
 [0,1,2,3].forEach(q=>{const qs=QS[q];set(L(qs)+'9',`${ORD[q]} CUARTO · ${fmt(el(q))}`);
  ['L','V'].forEach((s,k)=>{const n=L(qs+2*k),d=L(qs+2*k+1);
   S.g[q].filter(g=>g.s==s).forEach((g,i)=>set(d+(12+i),/^\d+$/.test(g.d)?+g.d:g.d));
   set(n+'27',c(q,s),`COUNTA(${d}12:${d}26)`);R[k].push(n+'27')})});
 set('D30',tot('L'),R[0].join('+'));set('N30',tot('V'),R[1].join('+'));return t}
async function xlsx(){
 const z=Uint8Array.from(atob(TPL),c=>c.charCodeAt(0)),v=new DataView(z.buffer),td=new TextDecoder(),te=new TextEncoder();
 let e=z.length-22;while(v.getUint32(e,true)!=0x06054b50)e--;
 const n=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);const en=[];
 for(let i=0;i<n;i++){const nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true),st=lo+30+v.getUint16(lo+26,true)+v.getUint16(lo+28,true),cs=v.getUint32(p+20,true);
  en.push({n:td.decode(z.subarray(p+46,p+46+nl)),m:v.getUint16(p+10,true),c:v.getUint32(p+16,true),s:cs,u:v.getUint32(p+24,true),d:z.subarray(st,st+cs)});p+=46+nl+xl+cl}
 for(const x of en)if(x.n=='xl/worksheets/sheet1.xml'||x.n=='xl/workbook.xml'){
  let t=td.decode(x.m?await inf(x.d):x.d);t=x.n.includes('sheet1')?fillSheet(t):t.replace(/<calcPr[^>]*\/>/,'<calcPr fullCalcOnLoad="1"/>');
  x.d=te.encode(t);x.m=0;x.c=crc(x.d);x.s=x.u=x.d.length}
 const out=[],cd=[];let off=0;
 for(const x of en){const nm=te.encode(x.n),h=new DataView(new ArrayBuffer(30)),k=new DataView(new ArrayBuffer(46));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(8,x.m,true);h.setUint32(14,x.c,true);h.setUint32(18,x.s,true);h.setUint32(22,x.u,true);h.setUint16(26,nm.length,true);
  k.setUint32(0,0x02014b50,true);k.setUint16(4,20,true);k.setUint16(6,20,true);k.setUint16(10,x.m,true);k.setUint32(16,x.c,true);k.setUint32(20,x.s,true);k.setUint32(24,x.u,true);k.setUint16(28,nm.length,true);k.setUint32(42,off,true);
  out.push(new Uint8Array(h.buffer),nm,x.d);cd.push(new Uint8Array(k.buffer),nm);off+=30+nm.length+x.d.length}
 const sz=cd.reduce((a,b)=>a+b.length,0),ed=new DataView(new ArrayBuffer(22));
 ed.setUint32(0,0x06054b50,true);ed.setUint16(8,en.length,true);ed.setUint16(10,en.length,true);ed.setUint32(12,sz,true);ed.setUint32(16,off,true);
 return new Blob([...out,...cd,new Uint8Array(ed.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let DB=JSON.parse(localStorage.fba||'null')||{cur:0,m:[]},tab=2,WL=0;
const blank=()=>({id:Date.now(),local:'',vis:'',comp:'',lugar:'',fecha:'',hora:'',del:'',obs:'',p:Array.from({length:16},()=>({d:'',n:''})),q:0,t:[0,1,2,3].map(()=>({ms:0,run:0})),g:[[],[],[],[]]});
const save=()=>{localStorage.fba=JSON.stringify(DB)};
function load(id){S=DB.m.find(m=>m.id==id);DB.cur=S.id;save();render()}
function nw(){DB.m.push(blank());load(DB.m[DB.m.length-1].id)}
function dl(){if(!confirm('¿Borrar este partido?'))return;DB.m=DB.m.filter(m=>m.id!=S.id);if(!DB.m.length)DB.m.push(blank());load(DB.m[DB.m.length-1].id)}
const inp=(k,l,t='text')=>`<label>${l}<input type=${t} value="${esc(S[k])}" oninput="S.${k}=this.value;save()"></label>`;
const vP=()=>inp('local','Equipo local')+inp('vis','Equipo visitante')+inp('comp','Competición / Jornada')+inp('lugar','Lugar (pabellón / localidad)')+inp('fecha','Fecha','date')+inp('hora','Hora','time')+inp('del','Delegado/a')+`<label>Observaciones<textarea rows=4 oninput="S.obs=this.value;save()">${esc(S.obs)}</textarea></label>`;
const vJ=()=>`<p class=h>Jugadores convocados · FBA Alicante</p>`+S.p.map((p,i)=>`<div class=pl><input inputmode=numeric placeholder="Nº" value="${esc(p.d)}" oninput="this.value=S.p[${i}].d=this.value.replace(/\\D/g,'');save()"><input placeholder="Nombre y apellidos" value="${esc(p.n)}" oninput="S.p[${i}].n=this.value;save()"></div>`).join('');
const nm=s=>(s=='L'?S.local:S.vis)||(s=='L'?'LOCAL':'VISITANTE');
function vM(){const q=S.q,r=S.t[q].run;
 return `<div class=sc><div>${esc(nm('L'))}<b>${tot('L')}</b></div><i>-</i><div>${esc(nm('V'))}<b>${tot('V')}</b></div></div>
<div class=qs>${[0,1,2,3].map(i=>`<button class="${i==q?'on':''}" onclick="sq(${i})">${ORD[i]}<br><small>${c(i,'L')}-${c(i,'V')}</small></button>`).join('')}</div>
<div class=cr id=cr>${fmt(el(q))}</div>
<div class=row><button class="${r?'pa':'go'}" onclick=tg()>${r?'⏸ Pausa':'▶ Iniciar'}</button><button onclick=rs()>↺ Reset</button></div>
<div class=row>${['L','V'].map(s=>`<button class="big ${s}" onclick="ag('${s}')" ${c(q,s)>=15?'disabled':''}>+ GOL<br><small>${esc(nm(s))} · ${c(q,s)}/15</small></button>`).join('')}</div>
<p class=h>Goles del ${ORD[q]} cuarto</p>${S.g[q].map((g,i)=>`<div class="gl ${g.s}"><span>${esc(nm(g.s))} · dorsal ${esc(g.d)}</span><span>${fmt(g.m)}</span><button onclick="dg(${i})">✕</button></div>`).reverse().join('')||'<p class=h>Sin goles</p>'}`}
function sq(i){S.t.forEach(x=>{if(x.run){x.ms+=Date.now()-x.run;x.run=0}});S.q=i;save();render()}
function tg(){const t=S.t[S.q];if(t.run){t.ms+=Date.now()-t.run;t.run=0;WL&&WL.release();WL=0}else{S.t.forEach(x=>{if(x.run){x.ms+=Date.now()-x.run;x.run=0}});t.run=Date.now();navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>WL=w).catch(()=>{})}save();render()}
function rs(){if(confirm('¿Poner a cero el cronómetro de este cuarto?')){S.t[S.q]={ms:0,run:0};save();render()}}
function dg(i){if(confirm('¿Borrar este gol?')){S.g[S.q].splice(i,1);save();render()}}
function ag(s){const ds=s=='L'?S.p.map(p=>p.d).filter(Boolean):[];
 $('#sh').innerHTML=`<div class=bx><h3>Dorsal del goleador · ${esc(nm(s))}</h3><div class=gr>${ds.map(d=>`<button onclick="ad('${s}','${d}')">${d}</button>`).join('')}</div><input id=di inputmode=numeric placeholder="Otro dorsal"><div class=row><button class=go onclick="ad('${s}',$('#di').value.replace(/\\D/g,'')||'x')">Añadir</button><button onclick="ad('${s}','x')">Sin dorsal</button><button onclick="$('#sh').hidden=1">Cancelar</button></div></div>`;$('#sh').hidden=0}
function ad(s,d){$('#sh').hidden=1;S.g[S.q].push({s,d,m:el(S.q)});save();render()}
const vE=()=>`<p class=h>Resumen</p>${[0,1,2,3].map(q=>`<p>${ORD[q]} cuarto: <b>${c(q,'L')} - ${c(q,'V')}</b> · ${fmt(el(q))}</p>`).join('')}<p>Final: <b>${tot('L')} - ${tot('V')}</b></p><button class=go onclick=ex(0)>⬇ Descargar Excel</button>${navigator.canShare?'<button onclick=ex(1)>Compartir…</button>':''}<button class=del onclick=dl()>Borrar este partido</button>`;
async function ex(share){const b=await xlsx(),n=`Ficha_${S.local||'local'}_vs_${S.vis||'visitante'}_${S.fecha||''}.xlsx`.replace(/[^\w.-]+/g,'_');
 if(share){try{await navigator.share({files:[new File([b],n,{type:b.type})]})}catch(e){}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}
function render(){
 $('#sel').innerHTML=DB.m.map(m=>`<option value="${m.id}" ${m.id==S.id?'selected':''}>${esc(m.local||'Local')} - ${esc(m.vis||'Visitante')} ${m.fecha||''}</option>`).join('');
 $('#nav').innerHTML=['Partido','Jugadores','Marcador','Excel'].map((n,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};render()">${n}</button>`).join('');
 $('#v').innerHTML=[vP,vJ,vM,vE][tab]()}
if(!DB.m.length)DB.m.push(blank());
S=DB.m.find(m=>m.id==DB.cur)||DB.m[0];render();
setInterval(()=>{const e=$('#cr');if(e)e.textContent=fmt(el(S.q))},250);
navigator.storage&&navigator.storage.persist&&navigator.storage.persist();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js');
</script></body></html>
